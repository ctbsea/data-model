version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dmdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dmdp
      MYSQL_USER: dmdp
      MYSQL_PASSWORD: dmdp123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - dmdp-network

  redis:
    image: redis:7-alpine
    container_name: dmdp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dmdp-network

volumes:
  mysql_data:
  redis_data:

networks:
  dmdp-network:
    driver: bridge

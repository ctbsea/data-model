version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dmdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmdp
      POSTGRES_USER: dmdp
      POSTGRES_PASSWORD: dmdp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init:/docker-entrypoint-initdb.d
    networks:
      - dmdp-network

volumes:
  postgres_data:

networks:
  dmdp-network:
    driver: bridge
